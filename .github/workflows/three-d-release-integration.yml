name: 3D dedicated integration infrastructure
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [cuda, modflow]
        required: true
jobs:
  cuda:
    if: inputs.suite == 'cuda'
    runs-on: [self-hosted, linux, x64, gpu]
    env:
      DARCY_FLOAT: float64
      PYTHONPATH: .:working_tests
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python -c 'import sys,warp as wp; assert sys.version_info[:2] == (3,12); assert wp.__version__ == "1.17.0"; assert wp.is_cuda_available()'
      - run: python -m pytest -q tests/test_3d_*.py tests/test_fast_3d_kcycle.py tests/test_npf662_*.py tests/test_terrain_*.py --timeout=600 --junitxml=release_evidence/cuda.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3d-cuda
          path: release_evidence/
  modflow:
    if: inputs.suite == 'modflow'
    # This runner must supply the pinned executable and tested environment.
    runs-on: [self-hosted, linux, x64, modflow662]
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      DARCYWARP_TEST_CPU_ONLY: '1'
      DARCY_FLOAT: float64
      PYTHONPATH: .:working_tests
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python -c 'import sys,warp as wp; assert sys.version_info[:2] == (3,12); assert wp.__version__ == "1.17.0"'
      - run: python -m pytest -q tests/test_npf662_*.py tests/test_3d_physics_validation.py tests/test_terrain_mf6_validation.py --timeout=600 --junitxml=release_evidence/modflow.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3d-modflow
          path: release_evidence/
