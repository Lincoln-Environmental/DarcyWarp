name: Terrain runtime smoke

on: [push, pull_request]

jobs:
  terrain-cpu:
    runs-on: ubuntu-latest
    env:
      DARCY_FLOAT: float64
      PYTHONPATH: .:working_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-pip.txt warp-lang numpy scipy pandas pytest flopy
      - run: python working_tests/smoke_terrain_runtime.py --device cpu
      - run: python -m pytest -q tests/test_terrain_runtime.py
