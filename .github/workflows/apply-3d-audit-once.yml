name: Apply verified 3D audit patch once

on:
  push:
    branches: [fix/3d-audit-20261102]
    paths:
      - '.audit-transfer/**'
      - '.github/workflows/apply-3d-audit-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Lincoln-Environmental/DarcyWarp' && github.ref == 'refs/heads/fix/3d-audit-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply the locally tested patch
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          expected_parent = '0f351eac5d5b6970909213d1b6af8f7e1b433dc8'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != expected_parent:
              raise RuntimeError('Audit transfer base changed; refusing to apply.')
          if os.environ['GITHUB_REF'] != 'refs/heads/fix/3d-audit-20261102':
              raise RuntimeError('Unexpected branch; refusing to apply.')
          payload = ''.join(Path(f'.audit-transfer/part-{index}.b64').read_text() for index in range(7))
          if len(payload) != 27316:
              raise RuntimeError('Unexpected payload size.')
          compressed = base64.b64decode(payload, validate=True)
          if hashlib.sha256(compressed).hexdigest() != '458569ab55cb1ba93ca410c6b5ca0d97bc649dd945f5a8b0f60cf180e18ee784':
              raise RuntimeError('Compressed patch checksum mismatch.')
          patch = gzip.decompress(compressed)
          if len(patch) != 70638 or hashlib.sha256(patch).hexdigest() != 'f4cf6678c1b7bf2f6a7e4dcc13ca7d5db88f6deb3b3384cf6bc74d14d7c6b69b':
              raise RuntimeError('Uncompressed patch checksum mismatch.')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          for index in range(7):
              subprocess.run(['git', 'rm', '--', f'.audit-transfer/part-{index}.b64'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix 3D state ownership, input validation and physical acceptance'
          git push origin HEAD:refs/heads/fix/3d-audit-20261102
