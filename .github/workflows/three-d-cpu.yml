name: Cartesian 3D and NPF CPU

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      DARCYWARP_TEST_CPU_ONLY: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      DARCY_FLOAT: float64
      PYTHONPATH: .:working_tests
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install warp-lang==1.17.0 numpy scipy pandas matplotlib flopy pytest filelock
      - name: Install pinned MODFLOW 6.6.2
        run: |
          mf6_dir="$RUNNER_TEMP/darcywarp-mf6"
          mkdir -p "$mf6_dir"
          curl -fsSL --retry 3 \
            https://github.com/MODFLOW-ORG/modflow6/releases/download/6.6.2/mf6.6.2_linux.zip \
            -o "$mf6_dir/release.zip"
          unzip -p "$mf6_dir/release.zip" mf6.6.2_linux/bin/mf6 > "$mf6_dir/mf6"
          printf '%s  %s\n' 9acdb07cae589555355b5d25b5ec1a7af7a0127ff95339ee14971ec7df6641ab "$mf6_dir/mf6" | sha256sum -c
          chmod +x "$mf6_dir/mf6"
          printf '%s\n' "$mf6_dir" >> "$GITHUB_PATH"
      - name: Cartesian and NPF contracts
        run: |
          python -m pytest -q -ra tests/test_3d_operator_analytical.py tests/test_3d_budget_acceptance.py \
            tests/test_3d_public_contract.py tests/test_3d_release_contract.py tests/test_3d_session.py \
            tests/test_3d_recharge.py \
            tests/test_npf662_transient.py tests/test_npf662_reference_controller.py

      - name: Numerical audit regressions
        run: |
          python -m pytest -q -ra tests/test_2d_main_audit.py tests/test_3d_main_audit.py \
            tests/test_boundary_head_inputs.py tests/test_transient_period_controls.py \
            tests/test_npf662_history.py tests/test_3d_sanity_runner.py tests/test_model_convergence_mf6_cache.py \
            tests/test_reference_main_audit.py tests/test_transient_artifacts.py tests/test_canterbury_boundaries.py \
            tests/test_transient_reference_consumers.py \
            tests/test_dynamic_riv_flux_2d.py tests/test_shanz_drn_flux_2d.py \
            tests/test_main_audit_followup.py tests/test_scientific_audit_regressions.py \
            tests/test_nov25_audit_references.py tests/test_nov25_audit_regressions.py \
            tests/test_npf662_local_balance.py tests/test_2d_local_acceptance.py tests/test_confined_steady_acceptance.py

      - name: Single-precision transient and boundary regressions
        env:
          DARCY_FLOAT: float32
        run: |
          python -m pytest -q -ra tests/test_transient_period_controls.py tests/test_boundary_head_inputs.py
          python -m pytest -q -ra tests/test_2d_main_audit.py -k 'picard_storage_maps or ghb_picard_periods or fp32'
          python -m pytest -q -ra tests/test_nov25_audit_regressions.py tests/test_2d_local_acceptance.py \
            tests/test_confined_steady_acceptance.py
          python -m pytest -q -ra tests/test_fas_transient_multistep.py \
            -k 'test_04_recharge_change_between_periods or test_05_negative_withdrawal_change_between_periods'
          python -m pytest -q -ra tests/test_3d_session.py -k failed_fp32_face_update
