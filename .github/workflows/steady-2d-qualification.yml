name: 3000 by 3000 steady MF6 comparison

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - '.github/workflows/steady-2d-qualification.yml'
      - 'tests/test_2d_unconfined.py'
      - 'tests/fixtures/unconfined_2d/truth_3000x3000.npz.lzma'

permissions:
  contents: read

jobs:
  steady:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DARCY_FLOAT: float64
      DARCYWARP_TEST_CPU_ONLY: '1'
      PYTHONPATH: .:working_tests
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install warp-lang==1.17.0 numpy scipy pandas matplotlib flopy pytest
      - name: Compare all active heads against the stored MODFLOW reference
        run: python -m pytest -q -s 'tests/test_2d_unconfined.py::test_unconfined_warp_matches_mf6_truth_all_grids[3000x3000]'
