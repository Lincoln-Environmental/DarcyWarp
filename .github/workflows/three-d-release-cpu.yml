name: 3D integration candidate CPU
on:
  pull_request:
    branches: [dev]
  push:
    branches: ['fix/3d-release-preparation']
  workflow_dispatch:
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [contract, npf, terrain, 2d]
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      DARCYWARP_TEST_CPU_ONLY: '1'
      DARCY_FLOAT: float64
      PYTHONPATH: .:working_tests
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      DARCYWARP_RELEASE_GROUP: '${{ matrix.group }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install warp-lang==1.17.0 numpy scipy pandas matplotlib flopy pytest pytest-timeout
      - run: python working_tests/run_3d_release_cpu.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: '3d-cpu-${{ matrix.group }}'
          path: release_evidence/ci/
