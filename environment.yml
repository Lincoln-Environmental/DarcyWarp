# Conda environment for DarcyWarp benchmark scripts.
# Project license: GNU AGPL v3.0 or later (see LICENSE).
name: darcywarp
channels:
  - conda-forge
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
dependencies:
  - numpy
  - pandas
  - python
  - sphinx
  - openpyxl
  - pytables
  - gdal
  - py7zr
  - scipy
  - matplotlib
  - pysheds
  - rasterio
  - scikit-learn
  - pyemu
  - scipy-stubs==1.16.3.1
  - pandas-stubs==2.3.2.250926
